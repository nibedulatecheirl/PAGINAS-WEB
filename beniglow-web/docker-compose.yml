services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beniglow_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - beniglow

  web:
    image: nginx:1.27-alpine
    container_name: beniglow_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - beniglow

  db:
    image: mariadb:11.4
    container_name: beniglow_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - beniglow_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - beniglow

  node:
    image: node:20-alpine
    container_name: beniglow_node
    profiles:
      - tools
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - beniglow

networks:
  beniglow:
    name: beniglow_network
    driver: bridge

volumes:
  beniglow_db_data:
    name: beniglow_db_data
