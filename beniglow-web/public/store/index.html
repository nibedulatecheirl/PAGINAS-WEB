<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  :root {
    --background: hsl(42 60% 98%);
    --foreground: hsl(24 28% 16%);
    --card: hsl(0 0% 100%);
    --card-foreground: hsl(24 28% 16%);
    --primary: hsl(95 28% 26%);
    --primary-foreground: hsl(42 60% 98%);
    --secondary: hsl(32 45% 89%);
    --secondary-foreground: hsl(24 28% 16%);
    --muted: hsl(34 35% 92%);
    --muted-foreground: hsl(25 14% 42%);
    --accent: hsl(20 38% 58%);
    --accent-foreground: hsl(0 0% 100%);
    --border: hsl(32 32% 84%);
    --ring: hsl(95 28% 26%);
    --radius: 1.5rem;

    --rose-gold: #B9826A;
    --bronze: #8A5E45;
    --coffee: #5B4638;
    --olive: #314D2F;
    --olive-soft: #4a6a44;
    --cream: #F8F1E8;
    --soft-cream: #FFFDF8;
  }

  html, body {
    background: var(--background);
    color: var(--foreground);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { overflow-x: hidden; }
  ::selection { background: var(--rose-gold); color: white; }

  .font-serif { font-family: 'Cormorant Garamond', serif; font-weight: 500; letter-spacing: -0.01em; }
  .font-script-soft { font-family: 'Dancing Script', cursive; font-weight: 600; letter-spacing: 0; }

  html { scroll-behavior: smooth; scroll-padding-top: 80px; }

  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
  }
  .animate-marquee { animation: marquee 45s linear infinite; }
  .animate-marquee:hover { animation-play-state: paused; }

  @keyframes marqueeSlow {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .animate-marquee-slow { animation: marqueeSlow 60s linear infinite; }
  .animate-marquee-slow:hover { animation-play-state: paused; }

  @keyframes kenburns {
    0%   { transform: scale(1.02) translate3d(0,0,0); }
    50%  { transform: scale(1.07) translate3d(-1%, -0.5%, 0); }
    100% { transform: scale(1.02) translate3d(0,0,0); }
  }
  .hero-kenburns { animation: kenburns 36s ease-in-out infinite; will-change: transform; }
  .hero-fallback {
    background:
      radial-gradient(70% 55% at 76% 42%, hsl(20 38% 88% / .70), transparent 62%),
      linear-gradient(120deg, var(--soft-cream) 0%, var(--cream) 55%, hsl(42 60% 96%) 100%);
  }
  .hero-image {
    opacity: 0;
    transition: opacity .75s ease;
  }
  .hero-image-ready {
    opacity: 1;
  }

  @keyframes heroPulse {
    0%,100% { opacity: .7; transform: scale(1); }
    50%     { opacity: 1;  transform: scale(1.06); }
  }
  .hero-pulse { animation: heroPulse 10s ease-in-out infinite; }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .hero-shimmer { animation: shimmer 6s linear infinite; }

  @keyframes drawStroke {
    from { stroke-dashoffset: 1; }
    to   { stroke-dashoffset: 0; }
  }
  .hero-stroke-draw {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: drawStroke 1.2s .9s ease-out forwards;
  }

  @keyframes scrollDot {
    0%   { transform: translateY(-100%); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(300%); opacity: 0; }
  }
  .hero-scroll-dot { animation: scrollDot 2.4s ease-in-out infinite; }

  .section-band {
    border-top: 1px solid hsl(32 32% 84% / .68);
    border-bottom: 1px solid hsl(32 32% 84% / .45);
  }
  .product-marquee-section {
    content-visibility: auto;
    contain-intrinsic-size: 620px;
  }
  .section-soft {
    background:
      linear-gradient(180deg, var(--soft-cream) 0%, hsl(42 58% 97%) 100%);
  }
  .section-cream {
    background:
      linear-gradient(180deg, hsl(34 48% 94%) 0%, hsl(42 60% 98%) 100%);
  }
  .section-blush {
    background:
      linear-gradient(180deg, hsl(20 42% 96%) 0%, hsl(34 42% 95%) 100%);
  }
  .section-sage {
    background:
      linear-gradient(180deg, hsl(96 24% 94%) 0%, hsl(42 56% 97%) 100%);
  }

  @keyframes chipIn {
    0% { opacity: 0; transform: translateY(8px) scale(.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .animate-float { animation: float 6s ease-in-out infinite; }
  @keyframes float-slow {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }
  .animate-float-slow { animation: float-slow 12s ease-in-out infinite; }
  .animate-float-slow-rev { animation: float-slow 14s ease-in-out infinite reverse; }

  @keyframes pingSlow {
    0% { transform: scale(1); opacity: .7; }
    80%, 100% { transform: scale(1.9); opacity: 0; }
  }
  .animate-ping-slow { animation: pingSlow 2.6s cubic-bezier(0,0,.2,1) infinite; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bronze); }
  ::-webkit-scrollbar-track { background: var(--soft-cream); }

  button, a, input, textarea, select { outline-color: var(--olive); }

  @media (max-width: 767px) {
    .hero-kenburns,
    .hero-pulse,
    .hero-shimmer,
    .animate-float,
    .animate-float-slow,
    .animate-float-slow-rev,
    .animate-ping-slow {
      animation: none !important;
    }

    .hero-kenburns {
      transform: none !important;
      will-change: auto;
    }

    .hero-image {
      transition-duration: .45s;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

</head>

<div id="root"></div>

<script src="/store/dist/components.js"></script>
<script src="/store/dist/sections-1.js"></script>
<script src="/store/dist/sections-2.js"></script>
<script src="/store/dist/app.js"></script>
</body>
</html>
